<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#ffffff"/>
  <meta name="description" content="Infogram: learn something useful in every scroll."/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Infogram"/>
  <title>Infogram</title>
  <script>
    // Apply the saved appearance before first paint (no white flash in dark mode).
    try {
      var choice = JSON.parse(localStorage.getItem('infogram_theme') || '"system"');
      var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
    } catch (e) {}
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
