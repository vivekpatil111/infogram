[project]
name = "infogram-backend"
version = "0.1.0"
description = "Infogram backend services"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<6.0",
  "djangorestframework>=3.15,<4.0",
  "djangorestframework-simplejwt>=5.3,<6.0",
  "django-cors-headers>=4.6,<5.0",
  "psycopg[binary]>=3.2,<4.0",
  "boto3>=1.35,<2.0",
  "channels>=4.2,<5.0",
  "channels-redis>=4.2,<5.0",
  "daphne>=4.1,<5.0",
  "whitenoise>=6.8,<7.0"
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = [
  "accounts*",
  "config*",
  "discovery*",
  "media_api*",
  "messaging*",
  "notifications*",
  "posts*",
  "stories*",
]
